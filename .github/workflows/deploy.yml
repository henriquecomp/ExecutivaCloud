name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Copia o arquivo .env seguro do seu servidor para dentro do diretorio do build
      - name: Copiar .env do servidor
        run: cp /home/henrique/.env_executivacloud ./.env

      - name: Build e Deploy dos Containers
        run: |
          docker compose down
          docker compose up -d --build
