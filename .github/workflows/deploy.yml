name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar arquivo .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          
      - name: Build e Deploy dos Containers
        run: |
          docker compose down
          docker compose up -d --build
